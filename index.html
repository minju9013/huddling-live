<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huddling — AI를 함께 실험하고 경험을 나누는 커뮤니티</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="token.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="page">

  <header class="header">
    <div class="logo">
      <img src="assets/logo.png" alt="Huddling 로고">
    </div>

    <nav class="auth-links body-16-m" aria-label="계정">
      <a href="#login">로그인</a>
      <a href="#signup">회원가입</a>
    </nav>

    <div class="auth-icons" aria-label="계정">
      <a href="#login" aria-label="로그인"><img src="assets/icon-login.svg" alt=""></a>
      <a href="#signup" aria-label="회원가입"><img src="assets/icon-signup.svg" alt=""></a>
    </div>
  </header>

  <main class="main">
    <div class="hero">
      <div class="hero-text">
        <h1 class="hero-title">
          <span>AI를 함께 실험하고</span>
          <span>경험을 나누는 커뮤니티</span>
        </h1>
        <p class="hero-desc body-16-m">지금 바로 3기 멤버십 알림 신청하고, 다음 성장의 주인공이 되어보세요.</p>
      </div>

      <div class="hero-image-wrap">
        <img class="glow" src="assets/glow-ellipse.svg" alt="" aria-hidden="true">
        <img class="hero-image" src="assets/penguins.png" alt="깃발을 든 펭귄과 아기 펭귄 일러스트">
      </div>

      <a href="#join" class="cta-button cta-inline heading-20-sb">지금 바로 참여하기</a>
    </div>
  </main>

  <footer class="footer">
    <a href="#join" class="cta-button cta-full heading-20-sb">지금 바로 참여하기</a>
    <img class="scroll-indicator" src="assets/icon-chevrons-down.svg" alt="아래로 스크롤">
  </footer>

</body>
</html>
